<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Free consultation registration</title>
  </head>
  <body>
    <form
      name="free-consultation"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="free-consultation" />
      <input name="subject" />
      <input name="plan-id" />
      <input name="plan-name" />
      <input name="issues" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="score-range" />
      <input name="goal" />
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" />
      <input name="bot-field" />
    </form>
  </body>
</html>
